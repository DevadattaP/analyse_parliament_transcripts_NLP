<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/static/images/favicon.ico"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF | Ministry Classification</title>
    <link rel="stylesheet" href="/static/css/index.css">
    <link rel="stylesheet" href="/static/css/upload.css">
</head>
<body>
    <div class="page-glow"></div>
    <main class="container upload-page">
        <section class="upload-card">
            <a href="/" class="back-link">Back to home</a>
            <h1>Upload Parliamentary PDF</h1>
            <p class="sub-copy">
                File is saved temporarily, processed asynchronously, and classified once with each of the seven methods.
            </p>

            <form id="uploadForm" class="upload-form" novalidate>
                <label class="drop-zone" id="dropArea" for="fileInput">
                    <input type="file" id="fileInput" name="file" accept=".pdf,application/pdf" required>
                    <span class="drop-zone-title">Drop a PDF here or click to browse</span>
                    <span class="drop-zone-sub">Only PDF is accepted in this version.</span>
                </label>

                <div class="selected-file" id="selectedFile" aria-live="polite"></div>

                <button type="submit" class="btn btn-primary submit-btn" id="submitBtn" disabled>
                    Start Classification
                </button>
            </form>

            <section class="task-panel" id="taskPanel" hidden>
                <h2>Task Status</h2>
                <p id="taskLine">Waiting to start...</p>
                <p id="taskMeta"></p>
                <div class="progress-track" aria-hidden="true">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <p id="methodsProgress" style="font-size: 0.9rem; margin-top: 0.5rem;">0/7 methods completed</p>
            </section>

            <section class="result-panel" id="resultPanel" hidden>
                <h2>Classification Results</h2>
                <div id="resultsContent"></div>
            </section>
        </section>
    </main>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal" hidden>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Paragraph Details</h2>
                <button id="detailModalClose" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button id="detailCompareBtn" type="button" class="btn btn-primary compare-btn">Compare</button>
            </div>
        </div>
    </div>

    <div id="compareModal" class="modal" hidden>
        <div class="modal-content compare-modal-content">
            <div class="modal-header">
                <h2>Method Comparison</h2>
                <button id="compareModalClose" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body" id="compareModalBody"></div>
        </div>
    </div>

    <script src="/static/js/upload.js"></script>
</body>
</html>
